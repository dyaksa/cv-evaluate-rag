version: "3.8"

services:
  evaluate_resume_service:
    container_name: "app-evaluate-resume"
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - .:/usr/src/app
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    command: [
        "gunicorn",
        "app:app", # atau "app.main:create_app()"
        "-w",
        "2",
        "--threads",
        "4",
        "--worker-class",
        "gthread", # stabil untuk I/O heavy; bisa ganti default
        "--bind",
        "0.0.0.0:8001",
        "--timeout",
        "60",
        "--graceful-timeout",
        "90",
        "--keep-alive",
        "5",
        "--max-requests",
        "1000",
        "--max-requests-jitter",
        "100",
      ]

  worker:
    container_name: "worker-evaluate"
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.celery", "worker", "--loglevel=info"]
    volumes:
      - .:/usr/src/app
    env_file:
      - .env
    environment:
      APP_GOOGLE_API_KEY: "${APP_GOOGLE_API_KEY}"
      GOOGLE_API_KEY: "${APP_GOOGLE_API_KEY}"
      OPENROUTER_BASE_URL_MODEL: "${APP_OPENROUTER_BASE_URL_MODEL}"
      OPENROUTER_API_KEY: "${APP_OPENROUTER_API_KEY}"
      OPENROUTER_LLM_MODEL: "${APP_OPENROUTER_LLM_MODEL}"
      ZHIPU_EMBEDDING_MODEL: "${APP_ZHIPU_EMBEDDING_MODEL}"
      ZHIPU_API_KEY: "${APP_ZHIPU_API_KEY}"
volumes:
  redis_data: {}
  app_data: {}
